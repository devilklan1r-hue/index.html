<script>
/* =====================================================
   DEVIL DNS - FIXED JAVASCRIPT
===================================================== */

const servers = {
  DE: {
    code: "DE",
    name: "آلمان",
    flag: "🇩🇪",
    ping: 42,
    endpoint: "demo-de.devil-dns.local:51820"
  },
  TR: {
    code: "TR",
    name: "ترکیه",
    flag: "🇹🇷",
    ping: 58,
    endpoint: "demo-tr.devil-dns.local:51820"
  },
  NL: {
    code: "NL",
    name: "هلند",
    flag: "🇳🇱",
    ping: 35,
    endpoint: "demo-nl.devil-dns.local:51820"
  },
  FR: {
    code: "FR",
    name: "فرانسه",
    flag: "🇫🇷",
    ping: 47,
    endpoint: "demo-fr.devil-dns.local:51820"
  }
};

let selectedServer =
  localStorage.getItem("devilServer") || "DE";

let connected = false;


/* ================= NAVIGATION ================= */

function openPage(page, button) {

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  const target = document.getElementById(page);

  if (target) {
    target.classList.add("active");
  }

  document.querySelectorAll(".bottomNav button").forEach(b => {
    b.classList.remove("active");
  });

  if (button) {
    button.classList.add("active");
  } else {

    const pages = [
      "home",
      "wireguard",
      "checker",
      "configs",
      "account",
      "settings"
    ];

    const index = pages.indexOf(page);
    const buttons =
      document.querySelectorAll(".bottomNav button");

    if (index >= 0 && buttons[index]) {
      buttons[index].classList.add("active");
    }
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ================= TOAST ================= */

function toast(message) {

  const box = document.getElementById("toast");

  if (!box) return;

  box.innerText = message;
  box.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    box.style.display = "none";
  }, 2200);
}


/* ================= SERVERS ================= */

function renderServers() {

  const list = document.getElementById("serverList");

  if (!list) return;

  list.innerHTML = "";

  Object.values(servers).forEach(server => {

    const div = document.createElement("div");

    div.className =
      "server " +
      (selectedServer === server.code ? "selected" : "");

    div.innerHTML = `
      <div class="serverLeft">
        <div class="flag">${server.flag}</div>

        <div>
          <div class="serverName">
            ${server.name}
          </div>

          <div class="serverMeta">
            ${server.code} • ${server.endpoint}
          </div>
        </div>
      </div>

      <div class="serverPing">
        ${server.ping} ms
      </div>
    `;

    div.onclick = () => selectServer(server.code);

    list.appendChild(div);
  });

  updateServerInfo();
}


function selectServer(code) {

  if (!servers[code]) return;

  selectedServer = code;

  localStorage.setItem(
    "devilServer",
    selectedServer
  );

  renderServers();

  toast(
    `سرور ${servers[code].name} انتخاب شد`
  );

  updateAccount();

  const autoSwitch =
    document.getElementById("autoSwitch");

  if (
    autoSwitch &&
    autoSwitch.classList.contains("on") &&
    !connected
  ) {
    setTimeout(connectVPN, 300);
  }
}


function updateServerInfo() {

  const server = servers[selectedServer];

  if (!server) return;

  const currentServer =
    document.getElementById("currentServer");

  const ping =
    document.getElementById("ping");

  if (currentServer) {
    currentServer.innerText = server.code;
  }

  if (ping) {
    ping.innerText = server.ping + " ms";
  }
}


/* ================= VPN DEMO ================= */

function connectVPN() {

  const button =
    document.getElementById("connectButton");

  const circle =
    document.getElementById("connectionCircle");

  const dot =
    document.getElementById("statusDot");

  const status =
    document.getElementById("statusText");

  if (!button || !circle || !dot || !status) {
    return;
  }

  if (connected) {

    connected = false;

    circle.classList.remove("active");

    dot.style.background = "var(--red)";
    dot.style.boxShadow =
      "0 0 12px var(--red)";

    status.innerText = "قطع است";

    button.innerText = "اتصال آزمایشی";

    toast("اتصال قطع شد");

    return;
  }


  button.disabled = true;
  button.innerText = "در حال اتصال...";

  status.innerText = "در حال اتصال";

  setTimeout(() => {

    connected = true;

    circle.classList.add("active");

    dot.style.background = "var(--green)";
    dot.style.boxShadow =
      "0 0 12px var(--green)";

    status.innerText = "متصل است";

    button.disabled = false;
    button.innerText = "قطع اتصال";

    toast(
      `اتصال دمو به ${servers[selectedServer].name} برقرار شد`
    );

  }, 1200);
}


/* ================= CONFIG ================= */

function getConfigs() {

  try {

    return JSON.parse(
      localStorage.getItem("devilConfigs") || "[]"
    );

  } catch (e) {

    return [];
  }
}


function saveConfigs(configs) {

  localStorage.setItem(
    "devilConfigs",
    JSON.stringify(configs)
  );
}


function downloadConfig() {

  const input =
    document.getElementById("configName");

  if (!input) return;

  let name =
    input.value.trim();

  if (!name) {
    name = `DEVIL-${selectedServer}`;
  }

  name = name.replace(
    /[^a-zA-Z0-9_\-]/g,
    "_"
  );

  const server = servers[selectedServer];

  const config = `[Interface]
PrivateKey = YOUR_PRIVATE_KEY
Address = 10.0.0.2/32
DNS = ${getSelectedDNS()}

[Peer]
PublicKey = DEMO_PUBLIC_KEY
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${server.endpoint}
PersistentKeepalive = 25
`;

  const blob =
    new Blob(
      [config],
      { type: "application/octet-stream" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = name + ".conf";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);


  const configs = getConfigs();

  configs.unshift({
    name: name,
    server: server.code,
    country: server.name,
    date: new Date().toLocaleString("fa-IR")
  });

  saveConfigs(configs);

  renderConfigs();
  updateAccount();

  toast("فایل CONF ساخته شد");
}


function getSelectedDNS() {

  const dns =
    document.getElementById("dnsSelect");

  return dns ?
    dns.value :
    "1.1.1.1";
}


/* ================= CONFIG LIST ================= */

function renderConfigs() {

  const list =
    document.getElementById("configList");

  if (!list) return;

  const configs = getConfigs();

  if (!configs.length) {

    list.innerHTML = `
      <div class="empty">
        هنوز هیچ کانفیگی ساخته نشده است.
      </div>
    `;

    return;
  }

  list.innerHTML = "";

  configs.forEach((config, index) => {

    const div =
      document.createElement("div");

    div.className = "file";

    div.innerHTML = `
      <div class="fileTitle">
        📄 ${escapeHTML(config.name)}.conf
      </div>

      <div class="fileMeta">
        🌍 ${escapeHTML(config.country)}
        • ${escapeHTML(config.server)}
        <br>
        🕒 ${escapeHTML(config.date)}
      </div>

      <button
        class="btn secondary smallBtn"
        onclick="deleteConfig(${index})"
      >
        حذف
      </button>
    `;

    list.appendChild(div);
  });
}


function deleteConfig(index) {

  const configs = getConfigs();

  if (
    index < 0 ||
    index >= configs.length
  ) return;

  configs.splice(index, 1);

  saveConfigs(configs);

  renderConfigs();
  updateAccount();

  toast("کانفیگ حذف شد");
}


function clearConfigs() {

  const configs = getConfigs();

  if (!configs.length) {
    toast("تاریخچه‌ای وجود ندارد");
    return;
  }

  if (
    !confirm("آیا تاریخچه کانفیگ‌ها پاک شود؟")
  ) {
    return;
  }

  localStorage.removeItem("devilConfigs");

  renderConfigs();
  updateAccount();

  toast("تاریخچه پاک شد");
}


/* ================= IP CHECKER ================= */

async function checkIP() {

  const input =
    document.getElementById("ipInput");

  const scan =
    document.getElementById("scanBox");

  const result =
    document.getElementById("ipResult");

  if (!input || !scan || !result) return;

  let ip =
    input.value.trim();

  if (!ip) {
    toast("یک IP وارد کن");
    input.focus();
    return;
  }

  scan.classList.add("active");
  result.classList.remove("show");

  const start =
    performance.now();

  try {

    /*
      اول IP را اعتبارسنجی می‌کنیم.
    */

    const ipInfo =
      detectIPType(ip);

    if (!ipInfo.valid) {
      throw new Error("IP نامعتبر است");
    }

    /*
      سرویس عمومی ipapi برای اطلاعات IP
    */

    const response =
      await fetch(
        "https://ipapi.co/" +
        encodeURIComponent(ip) +
        "/json/",
        {
          method: "GET"
        }
      );

    if (!response.ok) {
      throw new Error("خطا در دریافت اطلاعات");
    }

    const data =
      await response.json();

    const elapsed =
      Math.round(
        performance.now() - start
      );

    setText(
      "ipStatus",
      "بررسی شد"
    );

    setText(
      "ipAddress",
      ip
    );

    setText(
      "ipType",
      ipInfo.type
    );

    setText(
      "ipCountry",
      data.country_name || "---"
    );

    setText(
      "ipCity",
      data.city || "---"
    );

    setText(
      "ipISP",
      data.org || "---"
    );

    setText(
      "ipASN",
      data.asn || "---"
    );

    setText(
      "ipResponse",
      elapsed + " ms"
    );

    result.classList.add("show");

    toast("بررسی IP انجام شد");

  } catch (error) {

    /*
      اگر سرویس آنلاین در دسترس نبود،
      حداقل نوع IP را نشان می‌دهیم.
    */

    const elapsed =
      Math.round(
        performance.now() - start
      );

    setText(
      "ipStatus",
      "IP شناسایی شد"
    );

    setText(
      "ipAddress",
      ip
    );

    setText(
      "ipType",
      detectIPType(ip).type
    );

    setText(
      "ipCountry",
      "دریافت نشد"
    );

    setText(
      "ipCity",
      "دریافت نشد"
    );

    setText(
      "ipISP",
      "دریافت نشد"
    );

    setText(
      "ipASN",
      "دریافت نشد"
    );

    setText(
      "ipResponse",
      elapsed + " ms"
    );

    result.classList.add("show");

    toast(
      "اطلاعات آنلاین IP در دسترس نبود"
    );

  } finally {

    scan.classList.remove("active");
  }
}


function detectIPType(ip) {

  /*
    IPv4
  */

  const ipv4 =
    /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;

  if (ipv4.test(ip)) {

    return {
      valid: true,
      type: "IPv4"
    };
  }

  /*
    بررسی ساده IPv6
  */

  if (
    ip.includes(":") &&
    /^[0-9a-fA-F:]+$/.test(ip)
  ) {

    return {
      valid: true,
      type: "IPv6"
    };
  }

  return {
    valid: false,
    type: "نامعتبر"
  };
}


function clearIPResult() {

  const result =
    document.getElementById("ipResult");

  const input =
    document.getElementById("ipInput");

  if (result) {
    result.classList.remove("show");
  }

  if (input) {
    input.value = "";
    input.focus();
  }

  toast("نتیجه پاک شد");
}


/* ================= SETTINGS ================= */

function toggleSwitch(id) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.classList.toggle("on");

  const value =
    element.classList.contains("on");

  localStorage.setItem(
    "switch_" + id,
    value ? "1" : "0"
  );

  toast(
    value ?
    "فعال شد" :
    "غیرفعال شد"
  );
}


function loadSwitches() {

  [
    "saveSwitch",
    "notifySwitch",
    "autoSwitch",
    "compactSwitch"
  ].forEach(id => {

    const element =
      document.getElementById(id);

    if (!element) return;

    const saved =
      localStorage.getItem(
        "switch_" + id
      );

    if (saved !== null) {

      element.classList.toggle(
        "on",
        saved === "1"
      );
    }
  });
}


function changeDefaultServer() {

  const select =
    document.getElementById("defaultServer");

  if (!select) return;

  selectServer(select.value);
}


/* ================= EXPORT ================= */

function exportData() {

  const data = {
    server: selectedServer,
    configs: getConfigs(),
    switches: {
      save:
        getSwitchValue("saveSwitch"),

      notify:
        getSwitchValue("notifySwitch"),

      auto:
        getSwitchValue("autoSwitch"),

      compact:
        getSwitchValue("compactSwitch")
    },
    dns: getSelectedDNS(),
    exportedAt:
      new Date().toISOString()
  };

  const blob =
    new Blob(
      [JSON.stringify(data, null, 2)],
      { type: "application/json" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "devil-dns-backup.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  toast("فایل پشتیبان ساخته شد");
}


function getSwitchValue(id) {

  const element =
    document.getElementById(id);

  return !!(
    element &&
    element.classList.contains("on")
  );
}


/* ================= RESET ================= */

function resetSettings() {

  if (
    !confirm(
      "تنظیمات پنل به حالت اولیه برگردد؟"
    )
  ) {
    return;
  }

  localStorage.removeItem("devilServer");

  [
    "saveSwitch",
    "notifySwitch",
    "autoSwitch",
    "compactSwitch"
  ].forEach(id => {

    localStorage.removeItem(
      "switch_" + id
    );
  });

  selectedServer = "DE";

  const serverSelect =
    document.getElementById("defaultServer");

  if (serverSelect) {
    serverSelect.value = "DE";
  }

  loadSwitches();
  renderServers();

  toast("تنظیمات بازنشانی شد");
}


/* ================= ACCOUNT ================= */

function updateAccount() {

  const configs = getConfigs();

  const count =
    document.getElementById(
      "accountConfigCount"
    );

  const server =
    document.getElementById(
      "accountServer"
    );

  if (count) {
    count.innerText =
      configs.length;
  }

  if (server) {
    server.innerText =
      selectedServer;
  }

  const account =
    document.getElementById(
      "accountContent"
    );

  if (account) {

    account.innerHTML = `
      <div class="profile">

        <div class="avatar">
          D
        </div>

        <div class="profileName">
          DEVIL USER
        </div>

        <div class="profileStatus">
          ● ONLINE
        </div>

      </div>
    `;
  }
}


/* ================= ABOUT ================= */

function showAbout() {

  alert(
`DEVIL DNS

Gaming Network Panel

Version 2.0 DEMO

ساخته شده برای مدیریت ابزارهای
شبکه و کانفیگ‌های WireGuard.`
  );
}


/* ================= HELPERS ================= */

function setText(id, value) {

  const element =
    document.getElementById(id);

  if (element) {
    element.innerText =
      value == null ? "---" : value;
  }
}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ================= INIT ================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    renderServers();

    renderConfigs();

    updateAccount();

    loadSwitches();

    const serverSelect =
      document.getElementById(
        "defaultServer"
      );

    if (serverSelect) {
      serverSelect.value =
        selectedServer;
    }

    /*
      Enter داخل IP Checker
    */

    const ipInput =
      document.getElementById("ipInput");

    if (ipInput) {

      ipInput.addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {
            event.preventDefault();
            checkIP();
          }

        }
      );
    }

    /*
      Enter داخل نام کانفیگ
    */

    const configInput =
      document.getElementById(
        "configName"
      );

    if (configInput) {

      configInput.addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {
            event.preventDefault();
            downloadConfig();
          }

        }
      );
    }

    updateServerInfo();

  }
);

        </script>
