<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL DNS - پنل مدیریت</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
body { background: #0d1117; color: #f0f6fc; padding-bottom: 90px; }
header { background: #161b22; padding: 20px; text-align: center; border-bottom: 1px solid #30363d; }
.logo { font-size: 22px; font-weight: bold; color: #ff5317; }
.container { width: min(500px, 100%); margin: 15px auto; padding: 12px; }
.page { display: none; }
.page.active { display: block; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 18px; margin-bottom: 15px; }
h2 { font-size: 15px; margin-bottom: 12px; color: #fff; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
p, label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 6px; }
input, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; color: #fff; font-size: 13px; margin-bottom: 12px; outline: none; }
input:focus, textarea:focus { border-color: #ff5317; }
.btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: linear-gradient(135deg, #ff6b1a, #d11e00); color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }
.btn-sec { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.nav button { background: none; border: none; color: #8b949e; font-size: 11px; cursor: pointer; flex: 1; padding: 8px 0; }
.nav button.active { color: #ff5317; font-weight: bold; }
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #21262d; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; font-size: 12px; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.server-item { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<header>
    <div class="logo">DEVIL DNS</div>
</header>

<div class="container">
    <!-- صفحه خانه -->
    <div class="page active" id="p-home">
        <div class="card">
            <h2>وضعیت اتصال</h2>
            <p>سرویس اشتراک شما آماده و فعال است.</p>
            <button class="btn" id="conBtn" onclick="toggleConn()">برقراری اتصال</button>
        </div>
    </div>

    <!-- صفحه سرورها -->
    <div class="page" id="p-servers">
        <div class="card">
            <h2>سرورهای اشتراک</h2>
            <div class="server-item"><span>🇩🇪 آلمان - فرانکفورت</span> <span style="color:#3fb950; font-size:11px;">فعال</span></div>
            <div class="server-item"><span>🇫🇷 فرانسه - پاریس</span> <span style="color:#3fb950; font-size:11px;">فعال</span></div>
            <div class="server-item"><span>🇳🇱 هلند - آمستردام</span> <span style="color:#3fb950; font-size:11px;">فعال</span></div>
        </div>
    </div>

    <!-- صفحه ساخت کانفیگ -->
    <div class="page" id="p-builder">
        <div class="card">
            <h2>مدیریت و خروجی کانفیگ</h2>
            <label>لینک اشتراک:</label>
            <textarea id="subBox" rows="2"></textarea>
            <label>نام فایل خروجی (.conf):</label>
            <input type="text" id="fileName" value="devil-config">
            <button class="btn" onclick="saveSub()">ذخیره لینک</button>
            <button class="btn btn-sec" onclick="downloadConf()">دانلود فایل .conf</button>
        </div>
    </div>

    <!-- صفحه تست IP -->
    <div class="page" id="p-tester">
        <div class="card">
            <h2>تست پینگ و IP</h2>
            <label>آدرس هدف:</label>
            <input type="text" id="ipInput" value="8.8.8.8">
            <button class="btn" onclick="testIp()">شروع تست</button>
            <div id="testRes" style="margin-top: 10px; font-size: 12px;"></div>
        </div>
    </div>

    <!-- صفحه تنظیمات -->
    <div class="page" id="p-settings">
        <div class="card">
            <h2>تنظیمات</h2>
            <button class="btn btn-sec" onclick="resetData()" style="color:#ff473d; border-color:rgba(255,71,61,0.3);">پاکسازی اطلاعات</button>
        </div>
    </div>
</div>

<nav class="nav">
    <button class="active" onclick="goPage('home', this)">خانه</button>
    <button onclick="goPage('servers', this)">سرورها</button>
    <button onclick="goPage('builder', this)">ساخت کانفیگ</button>
    <button onclick="goPage('tester', this)">تست IP</button>
    <button onclick="goPage('settings', this)">تنظیمات</button>
</nav>

<div id="toast">پیام</div>

<script>
function showToast(txt) {
    const t = document.getElementById("toast");
    t.innerText = txt;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
}

function goPage(name, el) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("p-" + name).classList.add("active");
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    if(el) el.classList.add("active");
}

window.onload = function() {
    const saved = localStorage.getItem("sub_link");
    if(saved) {
        document.getElementById("subBox").value = saved;
    } else {
        document.getElementById("subBox").value = "https://ir.gholabi.shop:9991/sub/djMsMjA4ODE1LDE3OTA3MTczMTI.PQUeGXxF7foaEOncibQbmlossZnc4f_xnSu0Arzkl18";
    }
};

function saveSub() {
    const val = document.getElementById("subBox").value.trim();
    localStorage.setItem("sub_link", val);
    showToast("لینک ذخیره شد");
}

let isConnected = false;
function toggleConn() {
    isConnected = !isConnected;
    const btn = document.getElementById("conBtn");
    if(isConnected) {
        btn.innerText = "قطع ارتباط";
        btn.style.background = "#da3633";
        showToast("اتصال برقرار شد");
    } else {
        btn.innerText = "برقراری اتصال";
        btn.style.background = "linear-gradient(135deg, #ff6b1a, #d11e00)";
        showToast("ارتباط قطع شد");
    }
}

function downloadConf() {
    const content = document.getElementById("subBox").value;
    let name = document.getElementById("fileName").value.trim() || "config";
    name = name.replace(/[^a-zA-Z0-9_-]/g, "_");
    
    const blob = new Blob([content], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name + ".conf";
    a.click();
    URL.revokeObjectURL(url);
    showToast("فایل .conf دانلود شد");
}

async function testIp() {
    const ip = document.getElementById("ipInput").value.trim();
    const res = document.getElementById("testRes");
    if(!ip) return showToast("آی‌پی وارد کنید");
    
    res.innerHTML = "در حال بررسی...";
    try {
        const start = performance.now();
        const r = await fetch(`https://ipapi.co/${ip}/json/`);
        const end = performance.now();
        const d = await r.json();
        const ping = Math.round(end - start) + 15;
        
        res.innerHTML = `کشور: ${d.country_name || 'نامشخص'} | پینگ: ${ping}ms`;
        showToast("تست انجام شد");
    } catch(e) {
        res.innerHTML = "خطا در ارتباط با سرور تست";
    }
}

function resetData() {
    localStorage.clear();
    showToast("اطلاعات پاک شد");
    setTimeout(() => location.reload(), 1000);
}
</script>

</body>
</html>
